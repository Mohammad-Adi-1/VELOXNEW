<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Velox — Dice Roll Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="dicegame.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app-shell">
    
    <!-- Header -->
    <div class="app-header">
      <div class="header-overlay"></div>
      <div class="header-left">
        <span class="brand-name">VELOX</span>
      </div>
      <div class="header-actions" id="headerPreConnect">
        <button class="connect-btn" id="connectBtn">
          <i class="ti ti-brand-telegram"></i> Connect
        </button>
      </div>
      <div class="header-actions header-connected hidden" id="headerPostConnect">
        <button class="balance-btn" id="balanceBtn">
          <i class="ti ti-plus"></i>
          <span id="balanceAmount">0.00</span>
          <span class="balance-label">USDT</span>
        </button>
        <div class="avatar" id="userAvatar">AK</div>
      </div>
    </div>

    <div class="app-content" style="overflow: hidden;">
      
      <!-- Select Team Button -->
      <div style="text-align: center; margin-top: 6px; margin-bottom: 8px;">
        <button class="join-btn" id="enterSeasonBtn" style="width: auto; padding: 8px 18px; border-radius: 20px; font-size: 13px;">Select Team</button>
      </div>
      
      <!-- Dice Visual Section -->
      <div class="dice-game-section">
        <div class="dice-scene">
          <div class="dice" id="dice1">
            <div class="dice-face face-1"><span class="dot"></span></div>
            <div class="dice-face face-2"><span class="dot"></span><span class="dot"></span></div>
            <div class="dice-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="dice-face face-4"><div class="col"><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span></div></div>
            <div class="dice-face face-5"><div class="col"><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span></div></div>
            <div class="dice-face face-6"><div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          </div>
          <div class="dice" id="dice2">
            <div class="dice-face face-1"><span class="dot"></span></div>
            <div class="dice-face face-2"><span class="dot"></span><span class="dot"></span></div>
            <div class="dice-face face-3"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
            <div class="dice-face face-4"><div class="col"><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span></div></div>
            <div class="dice-face face-5"><div class="col"><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span></div></div>
            <div class="dice-face face-6"><div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="col"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>
          </div>
        </div>
        <div id="diceResult" class="dice-result">Roll the Dice!</div>
      </div>

      <!-- Betting Section -->
      <div class="bottom-action-container" style="padding-top: 0;">
        <div class="bet-config-box" style="height: auto;">
          <div class="bet-config-front" style="position: relative;">
            <div class="front-combined-box" style="padding: 12px 16px;">
              
              <!-- Bet Amount -->
              <div class="bet-config-section">
                <h4 class="bet-config-label">Bet Amount</h4>
                <div class="bet-tabs" id="diceBetAmountTabs">
                  <button class="bet-tab active" data-value="1">$1</button>
                  <button class="bet-tab" data-value="5">$5</button>
                  <button class="bet-tab" data-value="10">$10</button>
                  <button class="bet-tab" data-value="50">$50</button>
                </div>
              </div>

              <div class="front-divider" style="margin: 8px 0;"></div>

              <!-- Bet Target -->
              <div class="bet-config-section">
                <h4 class="bet-config-label">Select Your Bet (2-12 or Even/Odd)</h4>
                
                <div class="dice-bet-grid" id="diceBetTargets">
                  <!-- Specific Numbers -->
                  <button class="dice-bet-btn" data-target="2">2</button>
                  <button class="dice-bet-btn" data-target="3">3</button>
                  <button class="dice-bet-btn" data-target="4">4</button>
                  <button class="dice-bet-btn" data-target="5">5</button>
                  <button class="dice-bet-btn" data-target="6">6</button>
                  <button class="dice-bet-btn" data-target="7">7</button>
                  <button class="dice-bet-btn" data-target="8">8</button>
                  <button class="dice-bet-btn" data-target="9">9</button>
                  <button class="dice-bet-btn" data-target="10">10</button>
                  <button class="dice-bet-btn" data-target="11">11</button>
                  <button class="dice-bet-btn" data-target="12">12</button>
                </div>
                
                <div class="dice-bet-types" id="diceBetTypes" style="margin-top: 10px;">
                  <button class="dice-bet-type-btn" data-target="even">EVEN (2x)</button>
                  <button class="dice-bet-type-btn" data-target="odd">ODD (2x)</button>
                </div>

              </div>

              <!-- Roll Button -->
              <button class="main-play-btn" id="rollDiceBtn" style="margin-top: 10px;">
                <i class="ti ti-dice-5"></i> ROLL DICE
              </button>

            </div>
          </div>
        </div>
      </div>

    </div>
  <!-- Team Carousel Modal -->
  <div class="team-carousel-overlay hidden" id="teamCarouselOverlay">
    <div class="team-carousel-modal">
      <div class="team-carousel-header">
        <h2 class="carousel-heading">Select Your Team</h2>
        <button class="carousel-close" id="carouselClose"><i class="ti ti-x"></i></button>
      </div>
      <div class="team-carousel-body">
        <div class="carousel-container" id="teamCarousel">
          <div class="carousel-item active team-circle">
            <canvas class="liquid-canvas"></canvas>
            <h2 class="team-name-top">Team Circle</h2>
            <img src="../assets/TeamOptions/CircleTeam.png" alt="Circle Team" width="200" height="200" loading="lazy" decoding="async">
            <div class="carousel-overlay">
              <button class="team-select-btn">Select</button>
            </div>
          </div>
          <div class="carousel-item team-triangle">
            <canvas class="liquid-canvas"></canvas>
            <h2 class="team-name-top">Team Triangle</h2>
            <img src="../assets/TeamOptions/TriangleTeam.png" alt="Triangle Team" width="200" height="200" loading="lazy" decoding="async">
            <div class="carousel-overlay">
              <button class="team-select-btn">Select</button>
            </div>
          </div>
          <div class="carousel-item team-square">
            <canvas class="liquid-canvas"></canvas>
            <h2 class="team-name-top">Team Square</h2>
            <img src="../assets/TeamOptions/SquareTeam.png" alt="Square Team" width="200" height="200" loading="lazy" decoding="async">
            <div class="carousel-overlay">
              <button class="team-select-btn">Select</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="dicegame.js"></script>
</body>
</html>
